<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>翰林抽背 · 灵境课堂 | 双轨互动系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* 课堂投影更干净 */
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #1e2b1c 0%, #0f1a0c 100%);
            font-family: 'Segoe UI', 'Poppins', 'Noto Serif SC', 'Roboto', system-ui, serif;
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 主容器——古典书卷气息 */
        .scroll-container {
            max-width: 1400px;
            width: 100%;
            background: #fffaf0;
            background-image: radial-gradient(circle at 20% 35%, rgba(210, 180, 140, 0.15) 2%, transparent 2.5%);
            background-size: 32px 32px;
            border-radius: 64px;
            padding: 28px 32px 44px;
            box-shadow: 0 30px 45px rgba(0, 0, 0, 0.5), inset 0 1px 4px rgba(255, 250, 210, 0.9);
            border: 1px solid #ecdbaa;
        }

        /* 双核心抽选卡牌 */
        .duel-core {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            margin-bottom: 42px;
        }
        .oracle-card {
            flex: 1;
            min-width: 270px;
            background: #fff6ea;
            border-radius: 56px;
            padding: 26px 20px 34px;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15), inset 0 1px 0 rgba(255,245,215,0.8);
            border: 1px solid #f2e2c0;
            transition: all 0.2s;
        }
        .card-title {
            font-size: 1.7rem;
            font-weight: 800;
            color: #a5692c;
            text-align: center;
            letter-spacing: 4px;
            border-bottom: 3px solid #e7c48b;
            display: inline-block;
            width: 100%;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        .screen-area {
            text-align: center;
            min-height: 170px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fef3df;
            border-radius: 48px;
            margin: 12px 0 8px;
            padding: 28px 16px;
            box-shadow: inset 0 2px 6px rgba(80, 55, 25, 0.1), 0 6px 12px rgba(0,0,0,0.05);
        }
        #rollingStudent, #rollingTask {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #2c5e2a, #b4662c);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            transition: all 0.06s linear;
            word-break: break-word;
            line-height: 1.35;
            font-family: 'Segoe UI', 'Noto Serif SC', serif;
        }
        /* 高亮特效——金榜题名 */
        .highlight {
            background: linear-gradient(135deg, #e67e22, #ffb347, #ffdf8c);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 22px #ffb66e;
            animation: glowPulse 0.4s cubic-bezier(0.2, 1.1, 0.4, 1);
        }
        @keyframes glowPulse {
            0% { transform: scale(1); letter-spacing: 0px; opacity: 0.85; }
            45% { transform: scale(1.06); letter-spacing: 2px; text-shadow: 0 0 28px #ffaa44; }
            100% { transform: scale(1); letter-spacing: 0px; }
        }

        /* 主控按钮栏 */
        .command-bar {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin-bottom: 48px;
            flex-wrap: wrap;
        }
        .btn {
            font-size: 1.4rem;
            font-weight: 600;
            padding: 12px 34px;
            border: none;
            border-radius: 64px;
            cursor: pointer;
            transition: 0.2s;
            background: #4a5c40;
            color: #fff7e8;
            box-shadow: 0 5px 0 #2c3a26;
            letter-spacing: 2px;
            font-family: inherit;
        }
        .btn-roll {
            background: #b55b2a;
            box-shadow: 0 5px 0 #723b18;
        }
        .btn-roll:hover {
            background: #cf763c;
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #723b18;
        }
        .btn-stop {
            background: #9b4a38;
            box-shadow: 0 5px 0 #632a1c;
        }
        .btn-stop:hover {
            background: #bc5e48;
            transform: translateY(-2px);
        }
        .btn-reset-all {
            background: #5e6b4e;
            box-shadow: 0 5px 0 #3b4934;
        }
        .btn-reset-all:hover {
            background: #7d9670;
            transform: translateY(-2px);
        }

        /* 双栏管理区 */
        .management-flex {
            display: flex;
            flex-wrap: wrap;
            gap: 28px;
            margin-top: 12px;
        }
        .manage-panel {
            flex: 1;
            background: #fef7ec;
            border-radius: 48px;
            padding: 20px 26px;
            border: 1px solid #ecdbba;
            transition: 0.2s;
        }
        .panel-header {
            font-size: 1.3rem;
            font-weight: 700;
            color: #825a2e;
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 6px solid #e0a458;
            padding-left: 18px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .badge-num {
            background: #e9d7bb;
            padding: 3px 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #5c401f;
        }
        .input-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 22px;
        }
        .input-field {
            flex: 4;
            padding: 12px 22px;
            border-radius: 48px;
            border: 1px solid #dac29c;
            background: #fffdf9;
            font-size: 0.9rem;
            outline: none;
            font-family: monospace;
            transition: 0.2s;
        }
        .input-field:focus {
            border-color: #e0a458;
            box-shadow: 0 0 0 2px #ffddb0;
        }
        .small-btn {
            background: #7c9a6e;
            padding: 0 26px;
            border-radius: 48px;
            font-size: 0.9rem;
            font-weight: bold;
            border: none;
            color: white;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: 0.1s;
        }
        .small-btn:hover {
            background: #9bbd8a;
            transform: scale(0.97);
        }
        .list-container {
            max-height: 270px;
            overflow-y: auto;
            background: #fef4e3;
            border-radius: 36px;
            padding: 14px 12px;
            margin-top: 8px;
        }
        .tag {
            display: inline-block;
            background: #f6ecdb;
            padding: 6px 18px;
            margin: 6px 8px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #4e3a22;
            border-left: 3px solid #e0a458;
            transition: 0.05s;
        }
        .del-icon {
            margin-left: 12px;
            cursor: pointer;
            font-weight: bold;
            color: #bc6f3c;
            font-size: 0.85rem;
        }
        .del-icon:hover {
            color: #c0392b;
        }
        .empty-note {
            text-align: center;
            padding: 28px;
            color: #b48b54;
            font-style: italic;
        }
        .link-style {
            background: none;
            border: 1px solid #c7aa76;
            padding: 4px 16px;
            border-radius: 48px;
            font-size: 0.7rem;
            color: #8b6946;
            cursor: pointer;
            margin-left: auto;
            transition: 0.2s;
        }
        .link-style:hover {
            background: #e9d7bb;
        }
        @media (max-width: 860px) {
            #rollingStudent, #rollingTask { font-size: 1.3rem; }
            .btn { padding: 8px 22px; font-size: 1.1rem; }
            .card-title { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
<div class="scroll-container">
    <!-- 双轨抽选核心 -->
    <div class="duel-core">
        <div class="oracle-card">
            <div class="card-title">🎓 点将 · 学子</div>
            <div class="screen-area"><div id="rollingStudent">✨ 待抽选 ✨</div></div>
        </div>
        <div class="oracle-card">
            <div class="card-title">📜 翰林 · 任务</div>
            <div class="screen-area"><div id="rollingTask">📖 待抽任务 📖</div></div>
        </div>
    </div>

    <!-- 全局控制台 -->
    <div class="command-bar">
        <button class="btn btn-roll" id="startRollBtn">🌀 开始滚动抽选</button>
        <button class="btn btn-stop" id="stopPickBtn">🏆 定格 · 抽背</button>
        <button class="btn btn-reset-all" id="globalClearBtn">🗑️ 清空所有数据</button>
    </div>

    <!-- 双栏管理区 (学生+任务) -->
    <div class="management-flex">
        <!-- 学生管理面板 -->
        <div class="manage-panel">
            <div class="panel-header">
                👥 花名册 · 俊才
                <span class="badge-num" id="studentCount">0人</span>
                <button class="link-style" id="resetStudentDefault">📖 恢复默认班级</button>
            </div>
            <div class="input-group">
                <input type="text" id="studentInput" class="input-field" placeholder="例如: 欧阳若曦" autocomplete="off">
                <button class="small-btn" id="addStudentBtn">➕ 添加学子</button>
            </div>
            <div class="list-container" id="studentListArea">
                <div class="empty-note">✨ 暂无学生，请添加或恢复默认</div>
            </div>
        </div>

        <!-- 任务管理面板 -->
        <div class="manage-panel">
            <div class="panel-header">
                📚 抽背 · 任务典藏
                <span class="badge-num" id="taskCount">0项</span>
                <button class="link-style" id="resetTaskDefault">📜 恢复默认任务</button>
            </div>
            <div class="input-group">
                <input type="text" id="taskInput" class="input-field" placeholder="新任务: 背诵《赤壁赋》" autocomplete="off">
                <button class="small-btn" id="addTaskBtn">➕ 添加任务</button>
            </div>
            <div class="list-container" id="taskListArea">
                <div class="empty-note">📭 任务库为空，请添加抽背内容</div>
            </div>
        </div>
    </div>
</div>

<script>
    // =======================  1. 原始数据 (按题目提供) =======================
    const DEFAULT_STUDENTS = [
        "聂晓宇", "卢梦轩", "袁嘉萱", "周博禺", "周文华", "邓亚晨", "毛丽", "刘乐嘉", "范文馨", "欧阳霖颖",
        "彭浩霖", "周奕妍", "奉夏阳", "张馨予", "张漫", "唐晶磊", "曾靖岚", "张涛", "刘昊豫", "李瀚",
        "胡文强", "黄帅", "邓文轩", "周思淇", "蒋妙琳", "王炫琰", "于雅琪", "谢一帆", "田颖", "龚湘玲",
        "周楚涵", "文骏峰", "黄小娟", "蒋沂吾", "肖雄伟", "何苗苗", "陈珂菡", "曾云湘", "陈宇航", "文沁怡",
        "文雅琳", "黄欢", "李婧琪", "罗毅", "谢超", "段家杭", "桂自强", "李俊熙", "李健", "曾宇轩",
        "肖旭廷", "黄子珍", "唐亿可", "汪文健"
    ];

    const DEFAULT_TASKS = [
        "背诵《过洞庭》", "背诵《登岳阳楼》", "背诵《金陵怀古》", "背诵《阿房宫赋》第一段",
        "背诵《阿房宫赋》第二段", "背诵《阿房宫赋》第三段", "背诵《阿房宫赋》第四段",
        "背诵《谏太宗十思疏》第三段", "背诵《谏太宗十思疏》第二段", "背诵《谏太宗十思疏》第一段",
        "背诵《答司马谏议书》第一、三段", "背诵《谏太宗十思疏》第二段",
        "背诵《子路、曾皙、冉有、公西华侍坐》1-8段", "背诵《子路、曾皙、冉有、公西华侍坐》9-21段",
        "背诵《六国论》第一段", "背诵《六国论》第二段", "背诵《六国论》第三段",
        "背诵《六国论》第四、五段", "背诵《游园》"
    ];

    // ---------- 全局状态 ----------
    let studentsList = [];       // 学生数组
    let tasksList = [];          // 任务数组
    let rollingInterval = null;
    let isRolling = false;

    // DOM 元素
    const rollingStudentDiv = document.getElementById('rollingStudent');
    const rollingTaskDiv = document.getElementById('rollingTask');
    const startRollBtn = document.getElementById('startRollBtn');
    const stopPickBtn = document.getElementById('stopPickBtn');
    const globalClearBtn = document.getElementById('globalClearBtn');

    // 学生相关
    const studentInput = document.getElementById('studentInput');
    const addStudentBtn = document.getElementById('addStudentBtn');
    const studentListArea = document.getElementById('studentListArea');
    const studentCountSpan = document.getElementById('studentCount');
    const resetStudentDefaultBtn = document.getElementById('resetStudentDefault');

    // 任务相关
    const taskInput = document.getElementById('taskInput');
    const addTaskBtn = document.getElementById('addTaskBtn');
    const taskListArea = document.getElementById('taskListArea');
    const taskCountSpan = document.getElementById('taskCount');
    const resetTaskDefaultBtn = document.getElementById('resetTaskDefault');

    // ---------- 辅助函数 ----------
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // 渲染学生列表
    function renderStudentList() {
        if (!studentListArea) return;
        if (studentsList.length === 0) {
            studentListArea.innerHTML = `<div class="empty-note">🎓 暂无学子，请添加或点击「恢复默认班级」</div>`;
            studentCountSpan.innerText = `0人`;
            return;
        }
        let html = '';
        studentsList.forEach((stu, idx) => {
            html += `<span class="tag">${escapeHtml(stu)}<span class="del-icon" data-name="${escapeHtml(stu)}" data-type="student">✖️</span></span>`;
        });
        studentListArea.innerHTML = html;
        studentCountSpan.innerText = `${studentsList.length}人`;

        // 绑定删除事件 (学生)
        document.querySelectorAll('.del-icon[data-type="student"]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const name = btn.getAttribute('data-name');
                if (name) removeStudentByName(name);
            });
        });
    }

    function removeStudentByName(name) {
        const idx = studentsList.indexOf(name);
        if (idx !== -1) {
            studentsList.splice(idx, 1);
            if (studentsList.length === 0 && isRolling) maybeStopRollingByEmpty();
            renderStudentList();
            if (!isRolling) updateStaticStudentDisplay();
        }
    }

    function updateStaticStudentDisplay() {
        if (!isRolling) {
            if (studentsList.length > 0) rollingStudentDiv.innerText = studentsList[0];
            else rollingStudentDiv.innerText = "🎓 无学生";
            rollingStudentDiv.classList.remove('highlight');
        }
    }

    // 渲染任务列表
    function renderTaskList() {
        if (!taskListArea) return;
        if (tasksList.length === 0) {
            taskListArea.innerHTML = `<div class="empty-note">📭 抽背任务库为空，请添加或恢复默认任务</div>`;
            taskCountSpan.innerText = `0项`;
            return;
        }
        let html = '';
        tasksList.forEach((tsk, idx) => {
            html += `<span class="tag">${escapeHtml(tsk)}<span class="del-icon" data-taskname="${escapeHtml(tsk)}" data-type="task">✖️</span></span>`;
        });
        taskListArea.innerHTML = html;
        taskCountSpan.innerText = `${tasksList.length}项`;

        document.querySelectorAll('.del-icon[data-type="task"]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const taskVal = btn.getAttribute('data-taskname');
                if (taskVal) removeTaskByName(taskVal);
            });
        });
    }

    function removeTaskByName(taskContent) {
        const idx = tasksList.indexOf(taskContent);
        if (idx !== -1) {
            tasksList.splice(idx, 1);
            if (tasksList.length === 0 && isRolling) maybeStopRollingByEmpty();
            renderTaskList();
            if (!isRolling) updateStaticTaskDisplay();
        }
    }

    function updateStaticTaskDisplay() {
        if (!isRolling) {
            if (tasksList.length > 0) rollingTaskDiv.innerText = tasksList[0];
            else rollingTaskDiv.innerText = "📖 无抽背任务";
            rollingTaskDiv.classList.remove('highlight');
        }
    }

    // 如果学生或任务为空导致无法滚动，自动停止
    function maybeStopRollingByEmpty() {
        if (isRolling && (studentsList.length === 0 || tasksList.length === 0)) {
            stopRollingAndClearTimer();
            if (studentsList.length === 0) rollingStudentDiv.innerText = "❌ 无学生，停止滚动";
            if (tasksList.length === 0) rollingTaskDiv.innerText = "❌ 无任务，停止滚动";
            rollingStudentDiv.classList.remove('highlight');
            rollingTaskDiv.classList.remove('highlight');
        }
    }

    function stopRollingAndClearTimer() {
        if (rollingInterval) {
            clearInterval(rollingInterval);
            rollingInterval = null;
        }
        isRolling = false;
    }

    // 随机获取函数
    function getRandomStudent() {
        if (studentsList.length === 0) return "✨ 虚位以待 ✨";
        return studentsList[Math.floor(Math.random() * studentsList.length)];
    }
    function getRandomTask() {
        if (tasksList.length === 0) return "📭 无任务";
        return tasksList[Math.floor(Math.random() * tasksList.length)];
    }

    // 开始双轨滚动
    function startDoubleRoll() {
        if (studentsList.length === 0 || tasksList.length === 0) {
            let msg = "";
            if (studentsList.length === 0) msg += "学生名单为空！";
            if (tasksList.length === 0) msg += (msg ? " 且任务列表为空。" : "任务列表为空。");
            alert(`无法滚动: ${msg} 请添加学生/任务或恢复默认数据。`);
            return;
        }
        if (isRolling) return;
        rollingStudentDiv.classList.remove('highlight');
        rollingTaskDiv.classList.remove('highlight');
        if (rollingInterval) clearInterval(rollingInterval);
        rollingInterval = setInterval(() => {
            if (studentsList.length > 0) rollingStudentDiv.innerText = getRandomStudent();
            else if (studentsList.length === 0 && isRolling) maybeStopRollingByEmpty();
            if (tasksList.length > 0) rollingTaskDiv.innerText = getRandomTask();
            else if (tasksList.length === 0 && isRolling) maybeStopRollingByEmpty();
        }, 62);
        isRolling = true;
    }

    // 停止定格 + 高亮双项 (保证抽中的都在库内)
    function stopAndHighlight() {
        if (!isRolling) {
            // 未滚动时: 若当前显示有效内容则直接高亮, 否则修复显示首个有效内容
            const curStudent = rollingStudentDiv.innerText;
            const curTask = rollingTaskDiv.innerText;
            if (studentsList.length > 0) {
                if (studentsList.includes(curStudent)) rollingStudentDiv.classList.add('highlight');
                else { rollingStudentDiv.innerText = studentsList[0]; rollingStudentDiv.classList.add('highlight'); }
            } else {
                rollingStudentDiv.innerText = "🎓 无学生";
                rollingStudentDiv.classList.remove('highlight');
            }
            if (tasksList.length > 0) {
                if (tasksList.includes(curTask)) rollingTaskDiv.classList.add('highlight');
                else { rollingTaskDiv.innerText = tasksList[0]; rollingTaskDiv.classList.add('highlight'); }
            } else {
                rollingTaskDiv.innerText = "📖 无任务";
                rollingTaskDiv.classList.remove('highlight');
            }
            return;
        }
        // 滚动中 → 停止计时器
        if (rollingInterval) {
            clearInterval(rollingInterval);
            rollingInterval = null;
        }
        isRolling = false;

        let finalStudent = rollingStudentDiv.innerText;
        let finalTask = rollingTaskDiv.innerText;

        if (studentsList.length > 0) {
            if (!studentsList.includes(finalStudent) || finalStudent === "✨ 虚位以待 ✨") {
                finalStudent = studentsList[Math.floor(Math.random() * studentsList.length)];
                rollingStudentDiv.innerText = finalStudent;
            }
            rollingStudentDiv.classList.add('highlight');
        } else {
            rollingStudentDiv.innerText = "🎓 无学生可抽";
            rollingStudentDiv.classList.remove('highlight');
        }

        if (tasksList.length > 0) {
            if (!tasksList.includes(finalTask) || finalTask === "📭 无任务") {
                finalTask = tasksList[Math.floor(Math.random() * tasksList.length)];
                rollingTaskDiv.innerText = finalTask;
            }
            rollingTaskDiv.classList.add('highlight');
        } else {
            rollingTaskDiv.innerText = "📜 无抽背任务";
            rollingTaskDiv.classList.remove('highlight');
        }
    }

    // 清空全部 (学生+任务)
    function globalClearEverything() {
        if (confirm("⚠️ 清空所有学生及抽背任务？此操作不可撤销。")) {
            if (isRolling) stopRollingAndClearTimer();
            studentsList = [];
            tasksList = [];
            renderStudentList();
            renderTaskList();
            rollingStudentDiv.innerText = "✨ 已清空 ✨";
            rollingTaskDiv.innerText = "✨ 已清空 ✨";
            rollingStudentDiv.classList.remove('highlight');
            rollingTaskDiv.classList.remove('highlight');
        }
    }

    // 添加学生
    function addStudentAction() {
        let newName = studentInput.value.trim();
        if (newName === "") { alert("请输入学生姓名"); return; }
        studentsList.push(newName);
        renderStudentList();
        studentInput.value = "";
        if (!isRolling && studentsList.length > 0) {
            const placeholders = ["✨ 待抽选 ✨", "🎓 无学生", "✨ 已清空 ✨", "❌ 无学生，停止滚动"];
            if (placeholders.includes(rollingStudentDiv.innerText)) {
                rollingStudentDiv.innerText = studentsList[0];
                rollingStudentDiv.classList.remove('highlight');
            }
        }
    }

    // 添加任务
    function addTaskAction() {
        let newTask = taskInput.value.trim();
        if (newTask === "") { alert("请输入抽背任务"); return; }
        tasksList.push(newTask);
        renderTaskList();
        taskInput.value = "";
        if (!isRolling && tasksList.length > 0) {
            const placeholders = ["📖 待抽任务 📖", "📖 无抽背任务", "✨ 已清空 ✨", "❌ 无任务，停止滚动"];
            if (placeholders.includes(rollingTaskDiv.innerText)) {
                rollingTaskDiv.innerText = tasksList[0];
                rollingTaskDiv.classList.remove('highlight');
            }
        }
    }

    // 恢复默认学生 (根据题目提供的完整名单)
    function resetToDefaultStudents() {
        if (confirm("重置学生名单为原始班级（聂晓宇、卢梦轩...汪文健等54人）？当前学生将被覆盖。")) {
            if (isRolling && studentsList.length === 0 && tasksList.length > 0) { /* 保持 */ }
            studentsList = [...DEFAULT_STUDENTS];
            renderStudentList();
            if (!isRolling) {
                rollingStudentDiv.innerText = studentsList.length ? studentsList[0] : "🎓 无学生";
                rollingStudentDiv.classList.remove('highlight');
            }
        }
    }

    function resetToDefaultTasks() {
        if (confirm("重置为原始抽背任务（过洞庭、六国论等19项任务）？当前任务将被替换。")) {
            tasksList = [...DEFAULT_TASKS];
            renderTaskList();
            if (!isRolling) {
                rollingTaskDiv.innerText = tasksList.length ? tasksList[0] : "📖 无任务";
                rollingTaskDiv.classList.remove('highlight');
            }
        }
    }

    // ---------- 事件绑定 & 初始化 ----------
    function init() {
        studentsList = [...DEFAULT_STUDENTS];
        tasksList = [...DEFAULT_TASKS];
        renderStudentList();
        renderTaskList();
        rollingStudentDiv.innerText = studentsList.length ? studentsList[0] : "🎓 加载中";
        rollingTaskDiv.innerText = tasksList.length ? tasksList[0] : "📖 加载中";
        rollingStudentDiv.classList.remove('highlight');
        rollingTaskDiv.classList.remove('highlight');
        isRolling = false;
        if (rollingInterval) clearInterval(rollingInterval);

        startRollBtn.addEventListener('click', startDoubleRoll);
        stopPickBtn.addEventListener('click', stopAndHighlight);
        globalClearBtn.addEventListener('click', globalClearEverything);
        addStudentBtn.addEventListener('click', addStudentAction);
        addTaskBtn.addEventListener('click', addTaskAction);
        resetStudentDefaultBtn.addEventListener('click', resetToDefaultStudents);
        resetTaskDefaultBtn.addEventListener('click', resetToDefaultTasks);
        studentInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addStudentAction(); });
        taskInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addTaskAction(); });
    }

    init();
</script>
</body>
</html>
